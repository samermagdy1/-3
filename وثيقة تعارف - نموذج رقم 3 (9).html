<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وثيقة تعارف - نموذج رقم 3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5f9;--card:#fff;--tx:#1b2333;--mut:#667089;--pri:#0f5c4d;--pri2:#e3f3ef;--bd:#d6dbe6;--dg:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#171e2e;--tx:#e8ecf5;--mut:#98a2bb;--pri:#3fbfa4;--pri2:#173a34;--bd:#2b3550;--dg:#f2857e}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#171e2e;--tx:#e8ecf5;--mut:#98a2bb;--pri:#3fbfa4;--pri2:#173a34;--bd:#2b3550;--dg:#f2857e}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Cairo,Tahoma,Arial,sans-serif;padding-bottom:150px}
header{background:var(--pri);color:#fff;padding:18px 16px;text-align:center}
header h1{margin:0;font-size:1.25rem}header p{margin:4px 0 0;opacity:.9;font-size:.9rem}
main{max-width:920px;margin:0 auto;padding:12px}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
.info{font-size:.85rem;color:var(--mut);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
section{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:14px 0}
section h2{margin:0 0 10px;font-size:1.05rem;color:var(--pri);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
section h2 span{flex:1}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:10px}.g>*{min-width:0}
.g.l{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
label{display:block;font-size:.85rem;font-weight:600;color:var(--mut)}
input{width:100%;margin-top:3px;padding:10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit;min-height:44px}
input:focus{outline:2px solid var(--pri);border-color:transparent}.h{display:block;color:var(--dg);font-size:.75rem;font-weight:400}input.bad{border-color:var(--dg)}
.dt{display:flex;align-items:center;gap:4px;margin-top:3px}.dt input{flex:1 1 0;width:0;min-width:0;margin:0;text-align:center;padding:10px 4px}.dt input[data-p="2"]{flex:1.7}
.dt i{font-style:normal;font-weight:700;font-size:1.3rem;color:var(--mut)}.dt.bad input{border-color:var(--dg)}
.dt .nl{display:none;flex:1;direction:rtl;text-align:center;padding:9px;border:1px dashed var(--bd);border-radius:9px;cursor:pointer}.dt.nil .nl{display:block}.dt.nil input,.dt.nil i{display:none}
.w2{grid-column:1/-1}
.row{border:1px dashed var(--bd);border-radius:10px;padding:10px;margin-top:10px}
.row b{display:block;margin-bottom:6px;font-size:.9rem}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--pri);background:var(--pri2);color:var(--pri);border-radius:9px;padding:6px 12px;min-height:38px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button.p,.btn.p{background:var(--pri);color:#fff}
button.d{border-color:var(--dg);color:var(--dg);background:transparent}
button.s{font-size:.8rem;min-height:32px;padding:3px 10px}
.foot{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;z-index:5}
.foot button,.foot .btn{flex:1;max-width:260px;min-height:44px}.foot .wa{background:#1fa855;border-color:#1fa855;color:#fff;font-weight:700}[hidden]{display:none!important}
#fin,#ask{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#fin div,#ask div{background:var(--card);border-radius:14px;padding:18px;max-width:440px;width:100%;display:grid;gap:10px}
#fin p{margin:0;font-size:.9rem;color:var(--mut)}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:.9rem;opacity:0;transition:.3s;pointer-events:none;z-index:10}
@media(max-width:640px){main{padding:8px}section{padding:12px}header h1{font-size:1.08rem}.foot button,.foot .btn{font-size:.92rem;padding:6px 8px}}
</style></head><body>
